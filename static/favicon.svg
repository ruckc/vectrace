<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- A vibrant gradient to give it a modern tech feel -->
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" /> <!-- Green -->
      <stop offset="100%" stop-color="#3b82f6" /> <!-- Blue -->
    </linearGradient>
  </defs>

  <!-- Base container (Standard PWA rounded square) -->
  <rect width="512" height="512" rx="112" fill="#1e293b" />

  <!-- The main 'V' trace path -->
  <path d="M140 170 L256 370 L372 170" 
        fill="none" 
        stroke="url(#vGrad)" 
        stroke-width="56" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Vector Anchor Points (Nodes) -->
  <!-- Left Node -->
  <circle cx="140" cy="170" r="40" fill="#1e293b" stroke="#4ade80" stroke-width="20" />
  <!-- Bottom Node -->
  <circle cx="256" cy="370" r="40" fill="#1e293b" stroke="#0ea5e9" stroke-width="20" />
  <!-- Right Node -->
  <circle cx="372" cy="170" r="40" fill="#1e293b" stroke="#3b82f6" stroke-width="20" />
</svg>
