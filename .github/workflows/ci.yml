name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          install_args: node npm rust github:rustwasm/wasm-pack

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/vectrace-wasm

      - run: npm ci

      # The wasm glue is imported by src/, so svelte-check needs it to exist.
      - name: Build wasm engine
        run: mise run build:wasm

      - name: Lint and typecheck
        run: |
          npm run lint
          npm run check

      - name: Clippy
        run: mise run clippy

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
