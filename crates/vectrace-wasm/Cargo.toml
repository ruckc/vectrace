[package]
name = "vectrace-wasm"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "WebAssembly bindings around vtracer for vectrace"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly: 1.0.0-alpha.x is the only line that is wasm-safe (no clap/image deps).
vtracer = "=1.0.0-alpha.3"
visioncortex = "0.9"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
